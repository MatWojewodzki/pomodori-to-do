# https://github.com/tauri-apps/tauri-action?tab=readme-ov-file#example
# https://v2.tauri.app/distribute/pipelines/github/#example-workflow
name: release
permissions:
  contents: read
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Release tag name'
        required: true

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.validate-tag.outputs.tag_name }}
    steps:
      - name: validate tag
        id: validate-tag
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag-name || github.ref_name }}
        run: |
          set -euo pipefail

          echo "Validating tag: $TAG_NAME"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag format. Expected 'vX.Y.Z'."
              exit 1
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  build:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm
            platform: 'macos-latest'
            rust_target: 'aarch64-apple-darwin'

          - name: mac-intel
            platform: 'macos-26-intel'
            rust_target: 'x86_64-apple-darwin'

          - name: linux # If updated, change the value below accordingly.
            platform: 'ubuntu-22.04'
            rust_target: 'x86_64-unknown-linux-gnu'

          - name: windows
            platform: 'windows-latest'
            rust_target: 'x86_64-pc-windows-msvc'

          - name: android # If updated, change the values below accordingly
            platform: 'ubuntu-22.04'
            rust_target: 'android'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}

      - name: install dependencies (ubuntu only)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install java (android only)
        if: matrix.name == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: install frontend dependencies
        run: 'pnpm install --frozen-lockfile'

      - name: build app (desktop)
        if: matrix.name != 'android'
        run: 'pnpm tauri build --ci --target ${{ matrix.rust_target }}'

      - name: build app (android)
        if: matrix.name == 'android'
        run: 'pnpm tauri android build --apk --ci --target aarch64 --target armv7 --apk --ci'

      - name: sign apk (android, arm64)
        id: sign_apk_arm64
        if: matrix.name == 'android'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: 'src-tauri/gen/android/app/build/outputs/apk/arm64/release'
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: sign apk (android, arm)
        id: sign_apk_arm
        if: matrix.name == 'android'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: 'src-tauri/gen/android/app/build/outputs/apk/arm/release'
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.rust_target }}-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            ${{ steps.sign_apk_arm64.outputs.signedReleaseFile }}
            ${{ steps.sign_apk_arm.outputs.signedReleaseFile }}
          if-no-files-found: error

  publish-github:
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: target
          merge-multiple: true

      - name: create github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
          files: target/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
